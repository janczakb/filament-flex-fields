name: Flex Fields CI

on:
  push:
    paths:
      - '**'
  pull_request:
    paths:
      - '**'
  schedule:
    # Daily Filament compat + 5.x-dev canary (~06:00 UTC).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Whisper ships browser WASM; native Node CUDA binaries are not used in CI.
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: flex-fields-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Require committed composer.lock
        run: |
          set -euo pipefail
          if [[ ! -f composer.lock ]]; then
            echo "::error::composer.lock is missing from the git checkout. Track it in git (still export-ignored from Composer dist). See SUPPORT.md and issue #61."
            exit 1
          fi

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit
        run: composer audit --locked --no-interaction

      - name: Install npm dependencies
        run: npm ci

      - name: npm security audit
        if: matrix.php == '8.3'
        run: npm audit

      - name: Check generated documentation and license consistency
        if: matrix.php == '8.3'
        run: npm run docs:recipes:check && npm run docs:changelog:check && npm run docs:license:check

      # Select playground stress suites (~8k+) excluded from Pest — see composer test:select-atomics.
      - name: Run Pest
        if: matrix.php != '8.3'
        run: php -d memory_limit=2G vendor/bin/pest --compact

      - name: Run source-stamped PHP, JavaScript and static regression suites
        if: matrix.php == '8.3'
        run: node scripts/core/release-acceptance.mjs --phase=regression

      - name: Run component audit
        if: matrix.php == '8.3'
        run: npm run audit:components

      - name: Run bundle budget checks
        if: matrix.php == '8.3'
        run: |
          node scripts/core/release-acceptance.mjs --phase=reproducibility
          npm run check:budgets

      - name: Install Chromium for measured production runtime budgets
        if: matrix.php == '8.3'
        run: npx playwright install --with-deps chromium

      - name: Verify every core compatibility contract
        if: matrix.php == '8.3'
        run: node scripts/core/release-acceptance.mjs --phase=contracts

      - name: Measure native PHP and production browser profiles
        if: matrix.php == '8.3'
        run: node scripts/core/release-acceptance.mjs --phase=performance

      - name: Retain source-stamped acceptance logs and measurements
        if: always() && matrix.php == '8.3'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-acceptance-quality-${{ github.sha }}
          path: build/core-acceptance/**

  core-browsers:
    name: Core browser and installed author composition · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP at the supported floor
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install native dependencies and build sealed assets
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          npm run build
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Execute the entire browser contract matrix
        run: node scripts/core/release-acceptance.mjs --phase=browser --browser=${{ matrix.browser }}
      - name: Execute independent Composer install, composition, update and rollback
        run: node scripts/core/release-acceptance.mjs --phase=composer --browser=${{ matrix.browser }}
      - name: Retain source-stamped browser acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-acceptance-${{ matrix.browser }}-${{ github.sha }}
          path: build/core-acceptance/**

  core-release-gate:
    name: Verify source-matched core acceptance
    if: ${{ !cancelled() }}
    needs: [quality, core-browsers, core-integrations, core-sql, filament-compat]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every prerequisite job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.JOB_RESULTS); for (const [name, job] of Object.entries(jobs)) { if (job.result !== "success") throw Error("Required job failed or was skipped: " + name); }'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download acceptance evidence from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: core-acceptance-*-${{ github.sha }}
          path: build/downloaded-acceptance
      - name: Verify complete phases, commit, source, asset release and log digests
        run: node scripts/core/certify-acceptance.mjs --input=build/downloaded-acceptance --output=build/release-acceptance.json
      - name: Retain the automated acceptance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-acceptance-${{ github.sha }}
          path: |
            build/release-acceptance.json
            build/release-metadata/*

  core-release-attestation:
    name: Attest verified core release metadata
    needs: core-release-gate
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download metadata accepted by the release gate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-acceptance-${{ github.sha }}
          path: build/verified-release
      - name: Sign provenance for the accepted metadata
        id: provenance_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            build/verified-release/release-acceptance.json
            build/verified-release/release-metadata/build-provenance.json
            build/verified-release/release-metadata/sbom.cdx.json
      - name: Retain the verification bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-attestation-${{ github.sha }}
          path: ${{ steps.provenance_attestation.outputs.bundle-path }}

  core-integrations:
    name: Core · real Spatie adapters and Octane lifecycle (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_sqlite, pcntl
          tools: composer:v2

      - name: Install optional packages in the disposable CI checkout
        run: >-
          composer require --dev --no-scripts --no-interaction --prefer-dist --with-all-dependencies
          'filament/spatie-laravel-media-library-plugin:^5.6'
          'spatie/laravel-tags:^4.0' 'spatie/laravel-translatable:^6.0' 'laravel/octane:^2.0'

      - name: Verify core API and real Laravel queue lifecycle
        env:
          FLEX_CORE_SOAK_ITERATIONS: '20000'
        run: composer test:core

      - name: Verify real optional adapters and Octane request lifecycle
        env:
          FLEX_CORE_SOAK_ITERATIONS: '20000'
        run: composer test:core:optional

  core-sql:
    name: Core data · ${{ matrix.database.driver }} · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
        database:
          - driver: mysql
            image: mysql:8.4
            port: 3306
            username: root
            health: 'mysqladmin ping -h 127.0.0.1 --silent'
          - driver: pgsql
            image: postgres:17-alpine
            port: 5432
            username: postgres
            health: 'pg_isready -U postgres -d fff_core_probe_ci20261010'
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: disposable-core-ci
          MYSQL_DATABASE: fff_core_probe_ci20261010
          POSTGRES_PASSWORD: disposable-core-ci
          POSTGRES_DB: fff_core_probe_ci20261010
        ports:
          - 3306/tcp
          - 5432/tcp
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_mysql, pdo_pgsql, pcntl, posix
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify schema admission, create/edit, rollback and process contention
        env:
          FFF_DATA_DRIVER: ${{ matrix.database.driver }}
          FFF_DATA_DATABASE: fff_core_probe_ci20261010
          FFF_DATA_PORT: ${{ job.services.database.ports[matrix.database.port] }}
          FFF_DATA_USERNAME: ${{ matrix.database.username }}
          FFF_DATA_PASSWORD: disposable-core-ci
        run: |
          php scripts/compatibility/core-data-boundaries.php --disposable-sql
          php vendor/bin/pest --compact tests/Integration/MediaRelationConcurrencyTest.php

  filament-compat:
    name: Filament ${{ matrix.label }} · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            filament: '5.6.0'
            label: '5.6.0'
            legacy: true
          - php: '8.3'
            filament: '5.7.8'
            label: '5.7.8'
            legacy: true
          - php: '8.3'
            filament: '5.8.0'
            label: '5.8.0'
            legacy: true
          - php: '8.3'
            filament: '5.9.0'
            label: '5.9.0'
          - php: '8.4'
            filament: '5.9.0'
            label: '5.9.0'
          - php: '8.5'
            filament: '5.9.0'
            label: '5.9.0'
          - php: '8.3'
            filament: '^5.9'
            label: 'latest-5.x'
          - php: '8.4'
            filament: '^5.9'
            label: 'latest-5.x'
          - php: '8.5'
            filament: '^5.9'
            label: 'latest-5.x'

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Require committed composer.lock
        run: |
          set -euo pipefail
          if [[ ! -f composer.lock ]]; then
            echo "::error::composer.lock is missing from the git checkout. Track it in git (still export-ignored from Composer dist). See SUPPORT.md and issue #61."
            exit 1
          fi

      - name: Install Composer dependencies (lock)
        run: composer install --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Switch current Filament to ${{ matrix.label }}
        if: ${{ !matrix.legacy }}
        run: |
          set -euo pipefail
          composer require "filament/filament:${{ matrix.filament }}" --no-update --no-interaction
          composer update "filament/*" --with-all-dependencies --no-interaction --prefer-dist

      # Historical tags contain upstream advisories. Only this disposable API
      # compatibility fixture bypasses admission; current quality/audit stays strict.
      - name: Switch historical Filament to ${{ matrix.label }}
        if: matrix.legacy
        run: |
          set -euo pipefail
          composer require "filament/filament:${{ matrix.filament }}" --no-update --no-interaction
          composer update "filament/*" --with-all-dependencies --no-security-blocking --no-interaction --prefer-dist

      - name: Show installed Filament versions
        run: |
          set -euo pipefail
          php -r '
            require "vendor/autoload.php";
            foreach (["filament/filament", "filament/schemas", "filament/forms", "filament/support"] as $package) {
              echo $package, ": ", \Composer\InstalledVersions::getPrettyVersion($package), PHP_EOL;
            }
          '

      - name: Run Filament compatibility Pest suites
        run: composer test:filament-compat

      - name: Run full suite at the minimum supported Filament version
        if: matrix.filament == '5.6.0'
        run: php -d memory_limit=2G vendor/bin/pest --compact

      - name: Verify independently installed Composer component family
        if: ${{ !matrix.legacy }}
        run: php scripts/compatibility/core-author-tooling.php --composer-install

  filament-dev:
    name: Filament 5.x-dev canary (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Canary: surface breaks before a stable Filament tag; does not block merge by itself.
    continue-on-error: true
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Require committed composer.lock
        run: |
          set -euo pipefail
          if [[ ! -f composer.lock ]]; then
            echo "::error::composer.lock is missing from the git checkout. Track it in git (still export-ignored from Composer dist). See SUPPORT.md and issue #61."
            exit 1
          fi

      - name: Install Composer dependencies (lock)
        run: composer install --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Switch Filament to 5.x-dev
        run: |
          set -euo pipefail
          composer require "filament/filament:5.x-dev" --no-update --no-interaction
          composer update "filament/*" --with-all-dependencies --no-interaction --prefer-dist

      - name: Show installed Filament versions
        run: |
          set -euo pipefail
          php -r '
            require "vendor/autoload.php";
            foreach (["filament/filament", "filament/schemas", "filament/forms", "filament/support"] as $package) {
              echo $package, ": ", \Composer\InstalledVersions::getPrettyVersion($package), PHP_EOL;
            }
          '

      - name: Run Filament compatibility Pest suites
        run: composer test:filament-compat
