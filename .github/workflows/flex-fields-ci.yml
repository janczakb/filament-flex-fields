name: Flex Fields CI

on:
  push:
    paths:
      - '**'
  pull_request:
    paths:
      - '**'
  schedule:
    # Daily Filament compat + 5.x-dev canary (~06:00 UTC).
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: flex-fields-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Require committed composer.lock
        run: |
          set -euo pipefail
          if [[ ! -f composer.lock ]]; then
            echo "::error::composer.lock is missing from the git checkout. Track it in git (still export-ignored from Composer dist). See SUPPORT.md and issue #61."
            exit 1
          fi

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit
        run: composer audit --no-interaction
        continue-on-error: true

      - name: Install npm dependencies
        run: npm ci

      # Select playground stress suites (~8k+) excluded from Pest — see composer test:select-atomics.
      - name: Run Pest
        run: vendor/bin/pest --compact

      - name: Run PHPStan
        if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run component audit
        if: matrix.php == '8.3'
        run: npm run audit:components

      - name: Run bundle budget checks
        if: matrix.php == '8.3'
        run: npm run check:budgets

      - name: Run FFART consumer-graph suite
        if: matrix.php == '8.3'
        run: npm run test:consumer-graph

  filament-compat:
    name: Filament ${{ matrix.label }} · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            filament: '5.7.8'
            label: '5.7.8'
          - php: '8.4'
            filament: '5.7.8'
            label: '5.7.8'
          - php: '8.5'
            filament: '5.7.8'
            label: '5.7.8'
          - php: '8.3'
            filament: '^5.8'
            label: '5.8.x'
          - php: '8.4'
            filament: '^5.8'
            label: '5.8.x'
          - php: '8.5'
            filament: '^5.8'
            label: '5.8.x'

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Require committed composer.lock
        run: |
          set -euo pipefail
          if [[ ! -f composer.lock ]]; then
            echo "::error::composer.lock is missing from the git checkout. Track it in git (still export-ignored from Composer dist). See SUPPORT.md and issue #61."
            exit 1
          fi

      - name: Install Composer dependencies (lock)
        run: composer install --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Switch Filament to ${{ matrix.label }}
        run: |
          set -euo pipefail
          composer require "filament/filament:${{ matrix.filament }}" --no-update --no-interaction
          composer update "filament/*" --with-all-dependencies --no-interaction --prefer-dist

      - name: Show installed Filament versions
        run: |
          set -euo pipefail
          php -r '
            require "vendor/autoload.php";
            foreach (["filament/filament", "filament/schemas", "filament/forms", "filament/support"] as $package) {
              echo $package, ": ", \Composer\InstalledVersions::getPrettyVersion($package), PHP_EOL;
            }
          '

      - name: Run Filament compatibility Pest suites
        run: composer test:filament-compat

  filament-dev:
    name: Filament 5.x-dev canary (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Canary: surface breaks before a stable Filament tag; does not block merge by itself.
    continue-on-error: true
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Require committed composer.lock
        run: |
          set -euo pipefail
          if [[ ! -f composer.lock ]]; then
            echo "::error::composer.lock is missing from the git checkout. Track it in git (still export-ignored from Composer dist). See SUPPORT.md and issue #61."
            exit 1
          fi

      - name: Install Composer dependencies (lock)
        run: composer install --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Switch Filament to 5.x-dev
        run: |
          set -euo pipefail
          composer require "filament/filament:5.x-dev" --no-update --no-interaction
          composer update "filament/*" --with-all-dependencies --no-interaction --prefer-dist

      - name: Show installed Filament versions
        run: |
          set -euo pipefail
          php -r '
            require "vendor/autoload.php";
            foreach (["filament/filament", "filament/schemas", "filament/forms", "filament/support"] as $package) {
              echo $package, ": ", \Composer\InstalledVersions::getPrettyVersion($package), PHP_EOL;
            }
          '

      - name: Run Filament compatibility Pest suites
        run: composer test:filament-compat
