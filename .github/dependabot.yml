version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      # Daily: catch Filament minors/patches within ~24h of Packagist publish.
      interval: "daily"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 0
      semver-major-days: 3
      semver-minor-days: 0
      semver-patch-days: 0
    groups:
      filament:
        patterns:
          - "filament/*"
        update-types:
          - "minor"
          - "patch"
      filament-major:
        patterns:
          - "filament/*"
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # github-actions only accepts default-days; semver-*-days invalidate the whole file.
    cooldown:
      default-days: 3
